name: 🔍 Full Recon Pipeline v7 (Parallel)

on:
  workflow_dispatch:
    inputs:
      domains:
        description: 'Domains (comma-separated, NO http/https)'
        required: true
        default: 'example.com'
      discord_webhook:
        description: 'Discord Webhook URL'
        required: true
      depth:
        description: 'Crawling depth (1-5)'
        required: false
        default: '3'

env:
  PDCP_API_KEY: ${{ secrets.PDCP_API_KEY }}
  DISCORD_WEBHOOK: ${{ github.event.inputs.discord_webhook }}
  CRAWL_DEPTH: ${{ github.event.inputs.depth }}

jobs:
  # ============================================
  # JOB 1: Subdomain Enumeration (أسرع job)
  # ============================================
  subdomain-enum:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      subs-artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Tools
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq jq git wget curl unzip
          echo "$HOME/go/bin" >> $GITHUB_PATH
          export PATH=$PATH:$HOME/go/bin

          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/tomnomnom/assetfinder@latest
          go install -v github.com/projectdiscovery/chaos-client/cmd/chaos@latest
          go install -v github.com/tomnomnom/anew@latest

          wget -q https://github.com/findomain/findomain/releases/latest/download/findomain-linux.zip
          unzip -q findomain-linux.zip && chmod +x findomain && sudo mv findomain /usr/local/bin/

      - name: Parse Domains
        run: |
          echo "${{ github.event.inputs.domains }}" | tr ',' '\n' | sed 's/ //g; s|^https\?://||; s|^www\.||' | sort -u > domains.txt

      - name: 🔎 Subdomain Enumeration
        run: |
          set +e
          mkdir -p recon_output/subs

          while read domain; do
            [ -z "$domain" ] && continue
            echo "[*] Scanning: $domain"

            # Parallel tools using background jobs
            subfinder -d "$domain" -all -recursive -silent > "recon_output/subs/${domain}_subfinder.txt" 2>/dev/null &
            echo "$domain" | assetfinder --subs-only > "recon_output/subs/${domain}_assetfinder.txt" 2>/dev/null &
            findomain -t "$domain" -q > "recon_output/subs/${domain}_findomain.txt" 2>/dev/null &
            [ -n "$PDCP_API_KEY" ] && chaos -d "$domain" -silent > "recon_output/subs/${domain}_chaos.txt" 2>/dev/null &

            # crt.sh (API call)
            curl -s "https://crt.sh/?q=%25.${domain}&output=json" \
              | jq -r '.[].name_value' 2>/dev/null \
              | sed 's/\*\.//g' \
              | grep -E "^[a-zA-Z0-9.-]+\.${domain}$" \
              > "recon_output/subs/${domain}_crt.txt" &

            wait  # Wait for all background jobs
            sleep 1
          done < domains.txt

          # Merge all
          cat recon_output/subs/*.txt 2>/dev/null \
            | grep -E "^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$" \
            | sort -u > recon_output/subs/AllSubs.txt

          echo "[+] Total Subdomains: $(wc -l < recon_output/subs/AllSubs.txt)"

      - name: Upload Subdomains Artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: subs-${{ github.run_id }}
          path: recon_output/subs/
          retention-days: 1

  # ============================================
  # JOB 2: HTTPx Probing (يعتمد على Job 1)
  # ============================================
  httpx-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: subdomain-enum
    outputs:
      alive-artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install HTTPx
        run: |
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest

      - name: Download Subdomains
        uses: actions/download-artifact@v4
        with:
          name: subs-${{ github.run_id }}
          path: recon_output/subs/

      - name: 🌐 HTTPx Probing
        run: |
          set +e
          mkdir -p recon_output/subs

          if [ -s recon_output/subs/AllSubs.txt ]; then
            httpx -l recon_output/subs/AllSubs.txt \
              -status-code \
              -content-length \
              -web-server \
              -title \
              -follow-redirects \
              -silent \
              -threads 200 \
              -o recon_output/subs/AliveSubs_full.txt

            awk '{print $1}' recon_output/subs/AliveSubs_full.txt | sort -u > recon_output/subs/AliveSubs.txt
            echo "[+] Alive hosts: $(wc -l < recon_output/subs/AliveSubs.txt)"
          else
            touch recon_output/subs/AliveSubs.txt
          fi

      - name: Upload Alive Hosts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: alive-${{ github.run_id }}
          path: recon_output/subs/AliveSubs.txt
          retention-days: 1

  # ============================================
  # JOB 3: URL Extraction (يعتمد على Job 2)
  # ============================================
  url-extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: httpx-probe
    outputs:
      urls-artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tools
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq git wget curl python3-pip unzip
          echo "$HOME/go/bin" >> $GITHUB_PATH
          export PATH=$PATH:$HOME/go/bin

          go install -v github.com/tomnomnom/waybackurls@latest
          go install -v github.com/lc/gau/v2/cmd/gau@latest
          go install -v github.com/bp0lr/gauplus@latest
          go install -v github.com/projectdiscovery/katana/cmd/katana@latest
          go install -v github.com/hakluke/hakrawler@latest
          go install -v github.com/jaeles-project/gospider@latest
          go install -v github.com/tomnomnom/qsreplace@latest
          go install -v github.com/tomnomnom/gf@latest
          go install -v github.com/s0md3v/uro@latest

          pip3 install waymore paramspider arjun

          # GF patterns
          mkdir -p ~/.gf
          git clone --depth 1 https://github.com/1ndianl33t/Gf-Patterns.git /tmp/Gf-Patterns 2>/dev/null || true
          cp /tmp/Gf-Patterns/*.json ~/.gf/ 2>/dev/null || true

      - name: Download Alive Hosts
        uses: actions/download-artifact@v4
        with:
          name: alive-${{ github.run_id }}
          path: recon_output/subs/

      - name: 🔗 URL Extraction (Parallel)
        run: |
          set +e
          mkdir -p recon_output/urls

          if [ ! -s recon_output/subs/AliveSubs.txt ]; then
            echo "[!] No alive hosts"
            touch recon_output/urls/AllURLs.txt
            exit 0
          fi

          # Run tools in parallel (background jobs)
          cat recon_output/subs/AliveSubs.txt | waybackurls > recon_output/urls/all_wayback.txt 2>/dev/null &
          cat recon_output/subs/AliveSubs.txt | gau --threads 100 > recon_output/urls/all_gau.txt 2>/dev/null &
          gauplus -t 100 -random-agent < recon_output/subs/AliveSubs.txt > recon_output/urls/all_gauplus.txt 2>/dev/null &

          # Waymore (limit output)
          waymore -i recon_output/subs/AliveSubs.txt -mode U -l 500 -from 2022 -oU recon_output/urls/all_waymore.txt 2>/dev/null &

          # Katana (limit depth)
          katana -list recon_output/subs/AliveSubs.txt \
            -jc -kf all -d ${{ env.CRAWL_DEPTH }} \
            -fx -aff -fs rdn -f url -silent -nc 2>/dev/null > recon_output/urls/all_katana.txt &

          wait  # Wait for all

          # Merge
          cat recon_output/urls/all_*.txt 2>/dev/null \
            | grep -E "^https?://" \
            | sort -u > recon_output/urls/AllURLs.txt

          echo "[+] Total URLs: $(wc -l < recon_output/urls/AllURLs.txt)"

      - name: 🔧 Parameter Extraction
        run: |
          set +e
          mkdir -p recon_output/params

          if [ -s recon_output/urls/AllURLs.txt ]; then
            grep '=' recon_output/urls/AllURLs.txt > recon_output/params/urls_with_params.txt 2>/dev/null || true

            cat recon_output/params/urls_with_params.txt \
              | qsreplace "FUZZ" 2>/dev/null \
              | sort -u > recon_output/params/ParamURLs.txt || {
                  sed 's/=[^&]*/=FUZZ/g' recon_output/params/urls_with_params.txt | sort -u > recon_output/params/ParamURLs.txt
              }

            sed 's/=[^&]*/=/g' recon_output/params/urls_with_params.txt | sort -u > recon_output/params/param.txt || true
          else
            touch recon_output/params/{ParamURLs.txt,param.txt,urls_with_params.txt}
          fi

      - name: 🎯 GF Patterns
        run: |
          set +e
          mkdir -p recon_output/gf_patterns

          if [ -s recon_output/urls/AllURLs.txt ]; then
            for pattern in xss sqli idor ssrf redirect lfi rce ssti debug; do
              cat recon_output/urls/AllURLs.txt | gf "$pattern" 2>/dev/null | sort -u > "recon_output/gf_patterns/${pattern}.txt" || true
            done
          else
            for pattern in xss sqli idor ssrf redirect lfi rce ssti debug; do
              touch "recon_output/gf_patterns/${pattern}.txt"
            done
          fi

      - name: Upload URLs & Results
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: urls-${{ github.run_id }}
          path: |
            recon_output/urls/
            recon_output/params/
            recon_output/gf_patterns/
          retention-days: 7

  # ============================================
  # JOB 4: Summary & Discord (يعتمد على كل اللي فات)
  # ============================================
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [subdomain-enum, url-extraction]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: recon_output/
          pattern: '*-${{ github.run_id }}'
          merge-multiple: true

      - name: 📈 Generate Summary
        run: |
          set +e
          mkdir -p recon_output/final

          {
            echo "========== RECON SUMMARY =========="
            echo "Date: $(date)"
            echo "Domains: ${{ github.event.inputs.domains }}"
            echo ""
            echo "[+] Total Subdomains: $(wc -l < recon_output/subs/AllSubs.txt 2>/dev/null || echo 0)"
            echo "[+] Alive Hosts: $(wc -l < recon_output/subs/AliveSubs.txt 2>/dev/null || echo 0)"
            echo "[+] Total URLs: $(wc -l < recon_output/urls/AllURLs.txt 2>/dev/null || echo 0)"
            echo "[+] Parameter URLs: $(wc -l < recon_output/params/ParamURLs.txt 2>/dev/null || echo 0)"
            echo ""
            for f in recon_output/gf_patterns/*.txt; do
              [ -f "$f" ] && echo "[+] $(basename $f | cut -d. -f1): $(wc -l < "$f")"
            done
          } > recon_output/final/SUMMARY.txt

          cat recon_output/final/SUMMARY.txt

      - name: 📤 Discord Notification
        run: |
          set +e
          python3 << 'PYEOF'
          import os, requests

          webhook = os.environ.get('DISCORD_WEBHOOK')
          if not webhook:
              print("[!] No webhook"); exit(0)

          def count(f):
              try:
                  with open(f) as file: return len(file.readlines())
              except: return 0

          stats = {
              "subs": count('recon_output/subs/AllSubs.txt'),
              "alive": count('recon_output/subs/AliveSubs.txt'),
              "urls": count('recon_output/urls/AllURLs.txt'),
              "params": count('recon_output/params/ParamURLs.txt'),
          }

          for pattern in ['xss','sqli','idor','ssrf','redirect','lfi','rce','ssti','debug']:
              stats[pattern] = count(f'recon_output/gf_patterns/{pattern}.txt')

          embed = {
              "title": "🔍 Recon Complete",
              "color": 0x00ff00,
              "fields": [
                  {"name": "📊 Subdomains", "value": f"Total: `{stats['subs']}`\nAlive: `{stats['alive']}`", "inline": True},
                  {"name": "🔗 URLs", "value": f"Total: `{stats['urls']}`\nParams: `{stats['params']}`", "inline": True},
                  {"name": "🎯 XSS", "value": f"`{stats['xss']}`", "inline": True},
                  {"name": "💉 SQLi", "value": f"`{stats['sqli']}`", "inline": True},
                  {"name": "🔓 IDOR", "value": f"`{stats['idor']}`", "inline": True},
                  {"name": "🌐 SSRF", "value": f"`{stats['ssrf']}`", "inline": True},
                  {"name": "↩️ Redirect", "value": f"`{stats['redirect']}`", "inline": True},
                  {"name": "📁 LFI", "value": f"`{stats['lfi']}`", "inline": True},
                  {"name": "⚡ RCE", "value": f"`{stats['rce']}`", "inline": True},
              ]
          }

          try:
              resp = requests.post(webhook, json={"embeds": [embed]}, timeout=30)
              print(f"Sent: {resp.status_code}")
          except Exception as e:
              print(f"Error: {e}")

          for filepath in ['recon_output/final/SUMMARY.txt', 'recon_output/gf_patterns/xss.txt', 'recon_output/gf_patterns/sqli.txt']:
              try:
                  if os.path.exists(filepath) and 0 < os.path.getsize(filepath) < 8*1024*1024:
                      with open(filepath, 'rb') as f:
                          files = {'file': (os.path.basename(filepath), f)}
                          resp = requests.post(webhook, files=files, timeout=30)
                          print(f"Uploaded {filepath}: {resp.status_code}")
              except Exception as e:
                  print(f"Upload error: {e}")
          PYEOF

      - name: 📦 Upload Final Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recon-v7-${{ github.run_id }}
          path: recon_output/
          retention-days: 7
          if-no-files-found: warn
