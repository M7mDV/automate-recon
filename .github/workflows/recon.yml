      - name: 📤 Discord Notification - ALL FILES
        if: always()
        shell: bash
        run: |
          set +e
          python3 << 'PYEOF'
          import os
          import requests
          import glob
          
          webhook = os.environ.get('DISCORD_WEBHOOK')
          if not webhook:
              print("[!] No webhook")
              exit(0)
          
          def count(f):
              try:
                  with open(f) as file: 
                      return len(file.readlines())
              except: 
                  return 0
          
          def file_size_mb(f):
              try:
                  return os.path.getsize(f) / (1024 * 1024)
              except:
                  return 0
          
          # Collect stats
          stats = {
              "subs": count('recon_output/subs/AllSubs.txt'),
              "alive": count('recon_output/subs/AliveSubs.txt'),
              "urls": count('recon_output/urls/AllURLs.txt'),
              "params": count('recon_output/params/ParamURLs.txt'),
          }
          
          for pattern in ['xss','sqli','idor','ssrf','redirect','lfi','rce','ssti','debug']:
              stats[pattern] = count(f'recon_output/gf_patterns/{pattern}.txt')
          
          # Main summary embed
          embed = {
              "title": "🔍 Full Recon Complete - All Files Attached",
              "description": f"**Domains:** `{os.environ.get('DOMAINS', 'N/A')}`\n**Total Files:** Will be sent below",
              "color": 0x00ff00,
              "fields": [
                  {"name": "📊 Subdomains", "value": f"Total: `{stats['subs']}`\nAlive: `{stats['alive']}`", "inline": True},
                  {"name": "🔗 URLs", "value": f"Total: `{stats['urls']}`\nParams: `{stats['params']}`", "inline": True},
                  {"name": "🎯 XSS", "value": f"`{stats['xss']}`", "inline": True},
                  {"name": "💉 SQLi", "value": f"`{stats['sqli']}`", "inline": True},
                  {"name": "🔓 IDOR", "value": f"`{stats['idor']}`", "inline": True},
                  {"name": "🌐 SSRF", "value": f"`{stats['ssrf']}`", "inline": True},
                  {"name": "↩️ Redirect", "value": f"`{stats['redirect']}`", "inline": True},
                  {"name": "📁 LFI", "value": f"`{stats['lfi']}`", "inline": True},
                  {"name": "⚡ RCE", "value": f"`{stats['rce']}`", "inline": True},
              ],
              "footer": {"text": "Recon Pipeline v6.1 - All Files Mode"}
          }
          
          try:
              resp = requests.post(webhook, json={"embeds": [embed]}, timeout=30)
              print(f"[+] Summary sent: {resp.status_code}")
          except Exception as e:
              print(f"[!] Summary error: {e}")
          
          # ============================================
          # SEND ALL FILES FROM ALL DIRECTORIES
          # ============================================
          
          print("[*] Scanning for all output files...")
          
          # All directories to scan
          scan_dirs = [
              'recon_output/subs/',
              'recon_output/urls/',
              'recon_output/params/',
              'recon_output/gf_patterns/',
              'recon_output/final/',
          ]
          
          # Collect all .txt files
          all_files = []
          for directory in scan_dirs:
              if os.path.exists(directory):
                  txt_files = glob.glob(f"{directory}*.txt")
                  all_files.extend(txt_files)
          
          # Sort by directory then filename
          all_files.sort()
          
          print(f"[+] Found {len(all_files)} files to upload")
          
          # Discord limit: 8MB per file, 10 files per message
          MAX_FILE_SIZE = 8 * 1024 * 1024  # 8MB
          FILES_PER_BATCH = 5
          
          successful = 0
          failed = 0
          skipped = 0
          
          for i, filepath in enumerate(all_files, 1):
              try:
                  size_mb = file_size_mb(filepath)
                  filename = os.path.basename(filepath)
                  
                  # Skip empty files
                  if os.path.getsize(filepath) == 0:
                      print(f"[-] [{i}/{len(all_files)}] Skipping empty: {filename}")
                      skipped += 1
                      continue
                  
                  # Skip large files (>8MB)
                  if os.path.getsize(filepath) > MAX_FILE_SIZE:
                      print(f"[-] [{i}/{len(all_files)}] Skipping large ({size_mb:.1f}MB): {filename}")
                      skipped += 1
                      continue
                  
                  # Send file
                  with open(filepath, 'rb') as f:
                      # Send with description
                      payload = {
                          "content": f"📄 **{filename}** (`{size_mb:.2f} MB`) | `{filepath}`"
                      }
                      files = {'file': (filename, f)}
                      
                      resp = requests.post(webhook, data=payload, files=files, timeout=60)
                      
                      if resp.status_code in [200, 204]:
                          print(f"[+] [{i}/{len(all_files)}] Sent: {filename} ({size_mb:.2f}MB)")
                          successful += 1
                      else:
                          print(f"[!] [{i}/{len(all_files)}] Failed {resp.status_code}: {filename}")
                          failed += 1
                  
                  # Small delay to avoid rate limiting
                  import time
                  time.sleep(1)
                  
              except Exception as e:
                  print(f"[!] [{i}/{len(all_files)}] Error with {filepath}: {e}")
                  failed += 1
          
          # Final summary message
          final_msg = {
              "content": f"""
              ✅ **Upload Complete!**
              📁 Total Files: `{len(all_files)}`
              ✅ Successful: `{successful}`
              ❌ Failed: `{failed}`
              ⏭️ Skipped (empty/large): `{skipped}`
              """
          }
          
          try:
              requests.post(webhook, json=final_msg, timeout=30)
          except:
              pass
          
          print(f"\n[+] Done! Successful: {successful}, Failed: {failed}, Skipped: {skipped}")
          
          PYEOF
        env:
          DOMAINS: ${{ github.event.inputs.domains }}
